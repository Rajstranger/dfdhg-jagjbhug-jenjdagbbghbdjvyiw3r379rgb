<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Animation at Top of Page</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* Align to the top */
      padding-top: 5%; /* Add space from the top */
      background-color: #f0f0f0;
      position: relative;
    }

    svg {
      width: 90%; /* Adjusted for smaller screens */
      max-width: 800px;
      height: auto;
    }

    #line {
      fill: none;
      stroke: #e00000;
      stroke-width: 1.5;
      stroke-linecap: butt;
      stroke-linejoin: round;
      stroke-miterlimit: 4;
      stroke-opacity: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: dash 3s linear 3s 1 forwards; /* Run once, stay after animation */
    }

    #point {
      fill: none;
      stroke: #f00000;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-miterlimit: 0.1;
      stroke-opacity: 1;
      stroke-dasharray: 0.0001, 0.9999;
      stroke-dashoffset: 1;
      animation: dash 3s linear 3s 1 forwards; /* Run once, stay after animation */
    }

    @keyframes dash {
      0% {
        stroke-dashoffset: 1;
      }
      80% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    /* GIFs - Middle Left and Right */
    .gif-left, .gif-right {
      position: absolute;
      top: 50%; /* Middle of the screen */
      transform: translateY(-80%); /* Center vertically */
      width: 20%; /* Adjusted for smaller screens */
      max-width: 150px; /* Maximum size */
      height: auto;
      animation-duration: 5s;
      animation-fill-mode: forwards;
    }

    .gif-left {
      left: 5%; /* Adjusted for smaller screens */
      animation-name: moveRight;
    }

    .gif-right {
      right: 5%; /* Adjusted for smaller screens */
      animation-name: moveLeft;
    }

    @keyframes moveRight {
      0% {
        left: 5%;
      }
      100% {
        left: calc(45% - 75px); /* Move to the center */
      }
    }

    @keyframes moveLeft {
      0% {
        right: 5%;
      }
      100% {
        right: calc(60% - 75px); /* Move to the center */
      }
    }

    .new-emoji {
      position: absolute;
      top: 44%;
      left: 46%;
      transform: translate(-50%, -50%);
      width: 30%; /* Adjusted for smaller screens */
      max-width: 200px; /* Maximum size */
      height: auto;
      display: none; /* Initially hidden */
    }

    /* Text Animation */
    .text-animation {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5em; /* Adjusted for smaller screens */
      color: #e00000;
      display: none; /* Initially hidden */
      animation: fadeIn 2s ease-in-out forwards;
      text-align: center; /* Center text */
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    /* Next Button */
    .next-button {
      position: absolute;
      bottom: 10%; /* Adjusted for smaller screens */
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 1em;
      color: #fff;
      background-color: #e00000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .next-button:hover {
      background-color: #c00000;
    }

    /* Media Queries for Responsiveness */
    @media (max-width: 768px) {
      .text-animation {
        font-size: 1.2em; /* Smaller font size for tablets */
      }

      .new-emoji {
        width: 40%; /* Larger emoji for smaller screens */
      }
    }

    @media (max-width: 480px) {
      .text-animation {
        font-size: 1em; /* Smaller font size for smartphones */
      }

      .new-emoji {
        width: 50%; /* Larger emoji for smartphones */
      }

      .next-button {
        font-size: 0.9em; /* Smaller button text for smartphones */
        padding: 8px 16px; /* Smaller padding for smartphones */
      }
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" id="svg5" version="1.1" viewBox="-5 -5 278 56">
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
    <g id="layer1" transform="translate(29.1 -127.42)">
      <path id="line" d="M-28.73 167.2c26.43 9.21 68.46-9.46 85.45-12.03 18.45-2.78 32.82 4.86 28.75 9.83-3.82 4.66-25.77-21.18-14.81-31.5 9.54-8.98 17.64 10.64 16.42 17.06-1.51-6.2 2.95-26.6 14.74-22.11 11.7 4.46-4.33 49.03-15.44 44.08-6.97-3.1 15.44-16.26 26.1-16 23.03.56 55.6 27.51 126.63 3.36" pathLength="1" />
    </g>
    <g id="layer2" transform="translate(29.1 -127.42)">
      <path filter="url(#blur)" id="point" d="M-28.73 167.2c26.43 9.21 68.46-9.46 85.45-12.03 18.45-2.78 32.82 4.86 28.75 9.83-3.82 4.66-25.77-21.18-14.81-31.5 9.54-8.98 17.64 10.64 16.42 17.06-1.51-6.2 2.95-26.6 14.74-22.11 11.7 4.46-4.33 49.03-15.44 44.08-6.97-3.1 15.44-16.26 26.1-16 23.03.56 55.6 27.51 126.63 3.36" pathLength="1" />
    </g>
  </svg>

  <!-- GIFs -->
  <img class="gif-left" src="dudurun.gif" alt="Left GIF"> <!-- Replace with your left GIF URL -->
  <img class="gif-right" src="buburun.gif" alt="Right GIF"> <!-- Replace with your right GIF URL -->

  <!-- New Emoji -->
  <img class="new-emoji" src="hugdudububu.gif" alt="New Emoji"> <!-- Replace with your new emoji URL -->

  <!-- Text Animation -->
  <div class="text-animation">I Love You pookie 🎀</div>

  <!-- Next Button -->
  <button class="next-button">Next</button>

  <!-- Audio Elements -->
  <audio id="song1" src="running-14658.mp3"></audio> <!-- Replace with your song1 URL -->
  <audio id="song2" src="applause-cheer-236786.mp3"></audio> <!-- Replace with your song2 URL -->

  <!-- Confetti Effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const leftEmoji = document.querySelector('.gif-left');
      const rightEmoji = document.querySelector('.gif-right');
      const newEmoji = document.querySelector('.new-emoji');
      const textAnimation = document.querySelector('.text-animation');
      const song1 = document.getElementById('song1');
      const song2 = document.getElementById('song2');
      const nextButton = document.querySelector('.next-button');

      // Play song1 when the page loads
      song1.play();

      // Stop song1 after 3 seconds and play song2
      setTimeout(() => {
        song1.pause();
        song2.play();
      }, 3000);

      // Play audio when the "Next" button is clicked
      nextButton.addEventListener('click', () => {
        // song2.play();
        window.open("hugsong.html", "_self");
      });

      // Check when emojis meet
      const checkEmojiPosition = () => {
        const leftRect = leftEmoji.getBoundingClientRect();
        const rightRect = rightEmoji.getBoundingClientRect();

        // Check if the emojis overlap or are very close
        if (
          leftRect.right >= rightRect.left &&
          leftRect.left <= rightRect.right &&
          leftRect.bottom >= rightRect.top &&
          leftRect.top <= rightRect.bottom
        ) {
          // Hide the moving emojis
          leftEmoji.style.display = 'none';
          rightEmoji.style.display = 'none';

          // Show the new emoji
          newEmoji.style.display = 'block';

          // Show the text animation
          textAnimation.style.display = 'block';

          // Trigger confetti effect
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
          });

          // Stop checking positions
          clearInterval(interval);
        }
      };

      // Check positions every 100ms
      const interval = setInterval(checkEmojiPosition, 100);
    });
  </script>
</body>
</html>
